<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#0969da" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Globe/Earth representation -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Vertical line (prime meridian) -->
  <line x1="32" y1="10" x2="32" y2="54" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
  
  <!-- Horizontal line (equator) -->
  <line x1="12" y1="32" x2="52" y2="32" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
  
  <!-- Diagonal timezone lines -->
  <line x1="22" y1="12" x2="42" y2="52" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
  <line x1="42" y1="12" x2="22" y2="52" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
</svg>